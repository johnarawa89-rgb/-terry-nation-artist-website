media:
  input: images
  output: /images

content:
  - name: site
    label: Artist Information
    type: file
    path: content/site.json
    format: json
    fields:
      - name: artist_name
        label: Artist Name
        type: string
      - name: biography
        label: Biography
        type: text
      - name: instagram
        label: Instagram Link
        type: string
      - name: tiktok
        label: TikTok Link
        type: string
      - name: facebook
        label: Facebook Link
        type: string
      - name: youtube
        label: YouTube Link
        type: string

  - name: gallery
    label: Photo Gallery
    type: collection
    path: content/gallery
    fields:
      - name: title
        label: Photo Title
        type: string
      - name: image
        label: Photo
        type: image
